<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Three Lanes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1220;
    --card: rgba(15, 18, 32, 0.78);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f4f6fb;
    --muted: #a9b0c6;
    --accent: #ff3864;
    --accent2: #ff9f1c;
    --gold: #ffd23f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #23284a 0%, transparent 60%),
      var(--bg);
  }
  #stage {
    position: relative; margin: 0 auto;
    width: min(100vw, 480px); height: 100vh; height: 100dvh;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 0;
    pointer-events: none;
  }
  .pill {
    font-family: "Russo One", system-ui, sans-serif; font-size: 18px;
    background: var(--card); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 999px; min-width: 92px; text-align: center;
  }
  .pill small { display: block; font-family: system-ui, sans-serif; font-size: 10px;
    letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .pill.coins { color: var(--gold); }

  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(8, 10, 20, 0.35);
    transition: opacity .25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card {
    width: 100%; max-width: 340px; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 28px 22px 22px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  }
  .card h1 {
    font-family: "Russo One", system-ui, sans-serif; font-weight: 400;
    font-size: 40px; line-height: 1; margin: 0 0 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
  .big {
    font-family: "Russo One", system-ui, sans-serif; font-size: 56px; line-height: 1; margin: 4px 0 6px;
  }
  .badge {
    display: inline-block; margin-bottom: 14px; padding: 4px 12px; border-radius: 999px;
    background: rgba(255, 210, 63, .15); color: var(--gold); font-weight: 700; font-size: 13px;
  }
  .badge[hidden] { display: none; }
  button {
    appearance: none; border: 0; cursor: pointer; width: 100%;
    font: 400 22px "Russo One", system-ui, sans-serif; color: #fff;
    padding: 16px; border-radius: 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 24px rgba(255, 56, 100, 0.35);
    transition: transform .1s ease;
  }
  button:active { transform: scale(.97); }
  .how { display: flex; justify-content: center; gap: 18px; margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .how span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .how b { font-size: 22px; }
  .foot { margin-top: 16px; font-size: 13px; }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="road" aria-label="Car game"></canvas>

  <div class="hud" id="hud">
    <div class="pill"><small>Score</small><span id="score">0</span></div>
    <div class="pill coins"><small>Coins</small><span id="coins">0</span></div>
    <div class="pill"><small>Best</small><span id="best">0</span></div>
  </div>

  <div class="overlay" id="menu">
    <div class="card">
      <h1>Three Lanes</h1>
      <p>Dodge the traffic, grab the coins.<br>The road keeps getting faster.</p>
      <div class="how">
        <span><b>👆</b>Drag to steer</span>
        <span><b>🪙</b>+10 per coin</span>
        <span><b>⌨️</b>← → on desktop</span>
      </div>
      <button id="play">Drive</button>
      <div class="foot"><a href="https://github.com/AdamMorgan778/car-game">View on GitHub</a></div>
    </div>
  </div>

  <div class="overlay hidden" id="over">
    <div class="card">
      <h1>Crash!</h1>
      <div class="big" id="final">0</div>
      <p id="detail">points</p>
      <div class="badge" id="newbest" hidden>★ New best!</div>
      <button id="again">Drive again</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cvs = document.getElementById("road");
  const ctx = cvs.getContext("2d");
  const $ = id => document.getElementById(id);
  const ui = { score: $("score"), coins: $("coins"), best: $("best"), menu: $("menu"), over: $("over"),
               final: $("final"), detail: $("detail"), newbest: $("newbest") };

  const TRAFFIC = ["#4da3ff", "#ffd23f", "#b07cff", "#3ddc97", "#ff8f3f", "#5ee0f2", "#e8ecf4"];
  const PLAYER = "#ff3864";
  const TRAFFIC_SPEED = 0.55;   // traffic drives forward too, so it closes on you at a fraction of your speed

  let W, H, roadX, roadW, laneW, carW, carH;
  let state = "menu", speed = 0, baseSpeed = 0, elapsed = 0, dist = 0, scroll = 0;
  let coinCount = 0, points = 0, crashT = 0, shake = 0;
  let traffic = [], coins = [], sparks = [], trees = [];
  let nextSpawn = 0;
  const player = { x: 0, tx: 0, tilt: 0 };
  const keys = { left: false, right: false };

  let best = 0;
  try { best = parseInt(localStorage.getItem("threeLanesBest") || "0", 10) || 0; } catch (e) {}
  ui.best.textContent = best;

  // ---------- layout ----------
  function layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const oldW = W;
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const grass = Math.max(26, W * 0.1);
    roadX = grass; roadW = W - grass * 2; laneW = roadW / 3;
    carW = laneW * 0.54; carH = carW * 1.85;
    baseSpeed = H * 0.75;
    if (!oldW) { player.x = player.tx = W / 2; }
    else { player.x *= W / oldW; player.tx *= W / oldW; }
    trees = [];
    for (let y = -40; y < H + 80; y += 70 + Math.random() * 60) {
      trees.push(makeTree(y, 0), makeTree(y + 35, 1));
    }
  }
  function makeTree(y, side) {
    const r = 10 + Math.random() * 9;
    const x = side ? roadX + roadW + 8 + Math.random() * Math.max(0, roadX - 16 - r) + r / 2
                   : 8 + Math.random() * Math.max(0, roadX - 16 - r) + r / 2;
    return { x, y, r, side };
  }
  const laneCenter = l => roadX + laneW * (l + 0.5);
  const playerY = () => H - carH - Math.max(40, H * 0.08);

  // ---------- game flow ----------
  function start() {
    traffic = []; coins = []; sparks = [];
    dist = 0; elapsed = 0; coinCount = 0; points = 0; shake = 0;
    player.x = player.tx = W / 2; player.tilt = 0;
    nextSpawn = carH * 2.5;
    state = "play";
    ui.menu.classList.add("hidden"); ui.over.classList.add("hidden");
    updateHud();
  }
  function crash(x, y) {
    state = "crash"; crashT = 0; shake = 14;
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 260;
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.5,
                    c: Math.random() < 0.5 ? "#ffd23f" : "#ff8f3f" });
    }
    try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
    const isBest = points > best;
    if (isBest) { best = points; try { localStorage.setItem("threeLanesBest", best); } catch (e) {} }
    ui.final.textContent = points;
    ui.detail.textContent = `points · ${coinCount} coin${coinCount === 1 ? "" : "s"}`;
    ui.newbest.hidden = !isBest;
    updateHud();
  }
  function updateHud() {
    ui.score.textContent = points; ui.coins.textContent = coinCount; ui.best.textContent = best;
  }

  // ---------- update ----------
  function spawnRow() {
    const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
    const count = Math.random() < Math.min(0.55, 0.15 + elapsed * 0.01) ? 2 : 1;  // never all 3 lanes
    for (let i = 0; i < count; i++) {
      traffic.push({ x: laneCenter(lanes[i]), y: -carH * 1.3,
                     color: TRAFFIC[Math.floor(Math.random() * TRAFFIC.length)] });
    }
    const gap = carH * (2.3 + Math.random() * 1.8) * Math.max(0.75, 1 - elapsed * 0.004);
    if (Math.random() < 0.6) {
      coins.push({ x: laneCenter(Math.floor(Math.random() * 3)), y: -carH * 1.3 - gap / 2 + carH / 2, spin: Math.random() * 6 });
    }
    nextSpawn = gap;
  }

  function update(dt) {
    if (state === "menu") speed += (baseSpeed * 0.55 - speed) * Math.min(1, dt * 2);
    else if (state === "play") { elapsed += dt; speed = baseSpeed * Math.min(2.4, 1 + elapsed * 0.035); }
    else speed *= Math.max(0, 1 - dt * 3.5);

    scroll += speed * dt;
    const rel = speed * TRAFFIC_SPEED;

    // Background traffic on the menu screen, real traffic while playing.
    if (state === "menu" || state === "play") {
      nextSpawn -= rel * dt;
      if (nextSpawn <= 0) spawnRow();
    }

    if (state === "play") {
      dist += speed * dt;
      const steer = W * 1.3 * dt;
      if (keys.left) player.tx -= steer;
      if (keys.right) player.tx += steer;
    }
    const minX = roadX + carW / 2 + 4, maxX = roadX + roadW - carW / 2 - 4;
    if (state === "menu") player.tx = W / 2;
    player.tx = Math.max(minX, Math.min(maxX, player.tx));
    const prev = player.x;
    if (state === "play" || state === "menu") player.x += (player.tx - player.x) * Math.min(1, dt * 12);
    const vx = dt > 0 ? (player.x - prev) / dt : 0;
    player.tilt += (Math.max(-0.3, Math.min(0.3, vx / W * 0.35)) - player.tilt) * Math.min(1, dt * 10);

    for (const c of traffic) c.y += rel * dt;
    for (const c of coins) { c.y += rel * dt; c.spin += dt * 6; }
    traffic = traffic.filter(c => c.y < H + carH);
    coins = coins.filter(c => !c.got && c.y < H + carH);

    for (const t of trees) {
      t.y += speed * dt;
      if (t.y - t.r > H) Object.assign(t, makeTree(t.y - H - 80 - Math.random() * 40, t.side));
    }

    if (state === "play") {
      const py = playerY();
      const ix = carW * 0.14, iy = carH * 0.1;
      for (const c of traffic) {
        if (Math.abs(c.x - player.x) < carW - ix * 2 && c.y + iy < py + carH - iy && c.y + carH - iy > py + iy) {
          crash((c.x + player.x) / 2, (Math.max(c.y, py) + Math.min(c.y + carH, py + carH)) / 2);
          break;
        }
      }
      for (const c of coins) {
        if (Math.hypot(c.x - player.x, c.y - (py + carH / 2)) < carW * 0.75) {
          c.got = true; coinCount++;
          for (let i = 0; i < 8; i++) {
            const a = Math.random() * Math.PI * 2;
            sparks.push({ x: c.x, y: c.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, life: 0.35, c: "#ffd23f" });
          }
        }
      }
      if (state === "play") {
        points = Math.floor(dist / carH) + coinCount * 10;
        updateHud();
      }
    }

    if (state === "crash") {
      crashT += dt;
      if (crashT > 0.9) { state = "over"; ui.over.classList.remove("hidden"); }
    }

    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.92; s.vy *= 0.92; s.life -= dt; }
    sparks = sparks.filter(s => s.life > 0);
    shake = Math.max(0, shake - dt * 40);
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCar(cx, top, color, angle, isPlayer) {
    const w = carW, h = carH;
    ctx.save();
    ctx.translate(cx, top + h / 2);
    ctx.rotate(angle);

    ctx.fillStyle = "rgba(0,0,0,0.28)";                  // shadow
    rr(-w / 2 + 4, -h / 2 + 7, w, h, w * 0.3); ctx.fill();

    ctx.fillStyle = "#15161b";                           // wheels
    const ww = w * 0.16, wh = h * 0.2;
    for (const [sx, sy] of [[-1, -0.3], [1, -0.3], [-1, 0.3], [1, 0.3]]) {
      rr(sx * (w / 2) - ww / 2, sy * h - wh / 2, ww, wh, ww * 0.4); ctx.fill();
    }

    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);   // body
    g.addColorStop(0, shade(color, -0.25));
    g.addColorStop(0.5, color);
    g.addColorStop(1, shade(color, -0.25));
    ctx.fillStyle = g;
    rr(-w / 2, -h / 2, w, h, w * 0.32); ctx.fill();

    if (isPlayer) {                                      // racing stripes
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.fillRect(-w * 0.13, -h / 2 + 2, w * 0.08, h - 4);
      ctx.fillRect(w * 0.05, -h / 2 + 2, w * 0.08, h - 4);
    }

    ctx.fillStyle = "#1c2738";                           // windscreen + rear window
    rr(-w * 0.36, -h * 0.24, w * 0.72, h * 0.17, w * 0.12); ctx.fill();
    rr(-w * 0.33, h * 0.2, w * 0.66, h * 0.11, w * 0.1); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    rr(-w * 0.3, -h * 0.22, w * 0.25, h * 0.05, 3); ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.12)";            // roof
    rr(-w * 0.34, -h * 0.05, w * 0.68, h * 0.24, w * 0.12); ctx.fill();

    ctx.fillStyle = "#fff6c8";                           // headlights
    rr(-w * 0.42, -h / 2 + 3, w * 0.22, h * 0.05, 3); ctx.fill();
    rr(w * 0.2, -h / 2 + 3, w * 0.22, h * 0.05, 3); ctx.fill();
    ctx.fillStyle = "#ff2a3a";                           // tail lights
    rr(-w * 0.42, h / 2 - 3 - h * 0.04, w * 0.2, h * 0.04, 2); ctx.fill();
    rr(w * 0.22, h / 2 - 3 - h * 0.04, w * 0.2, h * 0.04, 2); ctx.fill();
    ctx.restore();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(v + (amt < 0 ? v * amt : (255 - v) * amt))));
    return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // grass with scrolling bands
    ctx.fillStyle = "#2f7a46"; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = "#348650";
    const band = 90, off = scroll % (band * 2);
    for (let y = -band * 2 + off; y < H + band; y += band * 2) ctx.fillRect(-20, y, W + 40, band);

    // trees
    for (const t of trees) {
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.beginPath(); ctx.arc(t.x + 4, t.y + 5, t.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1f5e34";
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2c7a45";
      ctx.beginPath(); ctx.arc(t.x - t.r * 0.25, t.y - t.r * 0.25, t.r * 0.55, 0, Math.PI * 2); ctx.fill();
    }

    // road
    const rg = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
    rg.addColorStop(0, "#26282f"); rg.addColorStop(0.5, "#30333b"); rg.addColorStop(1, "#26282f");
    ctx.fillStyle = rg; ctx.fillRect(roadX, -20, roadW, H + 40);

    // curbs
    const seg = 26, coff = scroll % (seg * 2);
    for (let y = -seg * 2 + coff; y < H + seg; y += seg) {
      ctx.fillStyle = Math.round((y - coff) / seg) % 2 ? "#e8ecf4" : "#e63946";
      ctx.fillRect(roadX - 7, y, 7, seg);
      ctx.fillRect(roadX + roadW, y, 7, seg);
    }

    // lane dashes
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    const dash = carH * 0.45, period = carH * 0.95, doff = scroll % period;
    for (let i = 1; i < 3; i++) {
      const x = roadX + laneW * i - 2.5;
      for (let y = -period + doff; y < H; y += period) ctx.fillRect(x, y, 5, dash);
    }

    // coins
    for (const c of coins) {
      const r = carW * 0.26, sx = Math.max(0.15, Math.abs(Math.cos(c.spin)));
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(sx, 1);
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.beginPath(); ctx.arc(3, 4, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#e5a800";
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffd23f";
      ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff3b0";
      ctx.fillRect(-r * 0.12, -r * 0.45, r * 0.24, r * 0.9);
      ctx.restore();
    }

    for (const c of traffic) drawCar(c.x, c.y, c.color, 0, false);
    drawCar(player.x, playerY(), PLAYER, player.tilt, true);

    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 2));
      ctx.fillStyle = s.c;
      ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- input ----------
  function pointerX(e) { const r = cvs.getBoundingClientRect(); return e.clientX - r.left; }
  let dragging = false;
  cvs.addEventListener("pointerdown", e => {
    if (state !== "play") return;
    dragging = true; player.tx = pointerX(e);
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cvs.addEventListener("pointermove", e => { if (dragging && state === "play") player.tx = pointerX(e); });
  const endDrag = () => { dragging = false; };
  cvs.addEventListener("pointerup", endDrag);
  cvs.addEventListener("pointercancel", endDrag);

  const setKey = (e, down) => {
    if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = down;
    else if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = down;
    else if (down && (e.key === " " || e.key === "Enter") && (state === "menu" || state === "over")) {
      e.preventDefault(); start();
    }
  };
  document.addEventListener("keydown", e => setKey(e, true));
  document.addEventListener("keyup", e => setKey(e, false));
  $("play").addEventListener("click", start);
  $("again").addEventListener("click", start);
  document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

  window.addEventListener("resize", layout);

  // ---------- loop ----------
  layout();
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
