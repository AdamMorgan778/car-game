<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1f; color: #eee;
    font-family: system-ui, sans-serif; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  canvas { background: #444; max-width: 100vw; max-height: 85vh; touch-action: none; }
  p { margin: 8px; opacity: .8; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<p>← → (or A / D) to steer · Space to start · tap left/right on mobile</p>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const LANES = 3, LANE_W = W / LANES;
const CAR_W = 50, CAR_H = 80;
const COLORS = ["#e74c3c", "#3498db", "#f1c40f", "#9b59b6", "#2ecc71"];

let state, player, enemies, speed, score, best = 0, spawnTimer, roadOffset;

function reset() {
  player = { lane: 1, x: laneX(1) };
  enemies = [];
  speed = 4;
  score = 0;
  spawnTimer = 0;
  roadOffset = 0;
}
function laneX(lane) { return lane * LANE_W + (LANE_W - CAR_W) / 2; }

function steer(dir) {
  if (state !== "playing") { start(); return; }
  player.lane = Math.max(0, Math.min(LANES - 1, player.lane + dir));
}
function start() { reset(); state = "playing"; }

document.addEventListener("keydown", e => {
  if (["ArrowLeft", "a", "A"].includes(e.key)) steer(-1);
  else if (["ArrowRight", "d", "D"].includes(e.key)) steer(1);
  else if (e.key === " ") { e.preventDefault(); if (state !== "playing") start(); }
});
canvas.addEventListener("pointerdown", e => {
  const r = canvas.getBoundingClientRect();
  steer(e.clientX - r.left < r.width / 2 ? -1 : 1);
});

function update() {
  if (state !== "playing") return;
  // Slide smoothly toward the chosen lane.
  player.x += (laneX(player.lane) - player.x) * 0.3;
  roadOffset = (roadOffset + speed) % 40;

  spawnTimer -= speed;
  if (spawnTimer <= 0) {
    const lane = Math.floor(Math.random() * LANES);
    enemies.push({ x: laneX(lane), y: -CAR_H, color: COLORS[Math.floor(Math.random() * COLORS.length)] });
    spawnTimer = 180 + Math.random() * 160;
  }

  const py = H - CAR_H - 20;
  for (const en of enemies) {
    en.y += speed;
    if (en.x < player.x + CAR_W - 6 && en.x + CAR_W - 6 > player.x &&
        en.y < py + CAR_H - 6 && en.y + CAR_H - 6 > py) {
      state = "over";
      best = Math.max(best, Math.floor(score));
    }
  }
  enemies = enemies.filter(en => en.y < H);
  score += speed / 10;
  speed += 0.002;
}

function drawCar(x, y, color, isPlayer) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, CAR_W, CAR_H);
  ctx.fillStyle = "#cde";                            // windows
  const front = isPlayer ? y + 12 : y + CAR_H - 28;
  ctx.fillRect(x + 8, front, CAR_W - 16, 16);
  ctx.fillStyle = "#111";                            // wheels
  for (const [dx, dy] of [[-4, 8], [CAR_W - 4, 8], [-4, CAR_H - 26], [CAR_W - 4, CAR_H - 26]])
    ctx.fillRect(x + dx, y + dy, 8, 18);
}

function draw() {
  ctx.fillStyle = "#444";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ddd";                            // lane markings
  for (let i = 1; i < LANES; i++)
    for (let y = -40 + roadOffset; y < H; y += 40)
      ctx.fillRect(i * LANE_W - 3, y, 6, 22);

  for (const en of enemies) drawCar(en.x, en.y, en.color, false);
  drawCar(player.x, H - CAR_H - 20, "#ecf0f1", true);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.textAlign = "left";
  ctx.fillText(`Score: ${Math.floor(score)}`, 10, 28);
  ctx.textAlign = "right";
  ctx.fillText(`Best: ${best}`, W - 10, 28);

  if (state !== "playing") {
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "bold 40px system-ui";
    ctx.fillText(state === "over" ? "CRASH!" : "CAR GAME", W / 2, H / 2 - 20);
    ctx.font = "20px system-ui";
    ctx.fillText("Press Space or tap to drive", W / 2, H / 2 + 20);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
reset();
state = "menu";
loop();
</script>
</body>
</html>
